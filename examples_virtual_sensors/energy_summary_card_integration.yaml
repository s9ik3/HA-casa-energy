# energy_summary_card_integration.yaml
# ==================================================
# Versione di energy_summary_card.yaml pensata per chi usa
# l'INTEGRAZIONE "Casa Energy" (custom_components/casa_energy)
# invece dei template YAML manuali.
#
# Con l'integrazione, un'unica entità espone già tutto quello
# che prima andava configurato a mano nella card:
# - sensor.<nome>_potenza_istantanea → attributi: status
#   (ok/warning/critical), percent_of_max, loads (elenco
#   nome+valore già pronto)
# - sensor.<nome>_storico_consumi_mensili → attributo mesi
#   (stesso formato di prima)
#
# COME TROVARE I TUOI ENTITY_ID REALI:
# Dopo aver configurato l'integrazione (Impostazioni →
# Dispositivi e servizi → Aggiungi integrazione → Casa Energy),
# vai su Impostazioni → Dispositivi e servizi → Entità, cerca
# "Casa Energy" per vedere i due entity_id generati con il nome
# che hai scelto in fase di configurazione.
#
# REQUISITI:
# - card_mod (HACS → Frontend)
# - button-card (HACS → Frontend)
# - Un input_boolean per il toggle mesi precedenti, es.:
#     input_boolean:
#       mostra_mesi_precedenti:
#         name: Mostra mesi precedenti
#         icon: mdi:calendar-month
#
# COME USARE QUESTO FILE:
# 1. Sostituisci i due <SOSTITUISCI: ...> con i tuoi entity_id
#    reali (li trovi come spiegato sopra).
# 2. Incolla il blocco YAML in una card del tuo dashboard
#    (modalità YAML dell'editor Lovelace).
# Nessun'altra modifica necessaria: soglie, carichi e colori
# sono già tutti negli attributi dell'entità.
# ==================================================

type: vertical-stack
cards:
  - type: custom:button-card
    show_name: false
    show_state: false
    show_icon: false
    show_label: false
    layout: vertical
    styles:
      card:
        - padding: 12px
        - border-radius: 16px
        - backdrop-filter: blur(10px)
        - background: |
            [[[
              const st = states['<SOSTITUISCI: sensor.casa_potenza_istantanea>']?.attributes?.status;
              if (st === 'critical') return 'rgba(229,57,53,0.12)';
              if (st === 'warning') return 'rgba(251,140,0,0.10)';
              return 'rgba(255,255,255,0.08)';
            ]]]
        - border: |
            [[[
              const st = states['<SOSTITUISCI: sensor.casa_potenza_istantanea>']?.attributes?.status;
              if (st === 'critical') return '1px solid rgba(229,57,53,0.32)';
              if (st === 'warning') return '1px solid rgba(251,140,0,0.28)';
              return '1px solid rgba(255,255,255,0.12)';
            ]]]
        - box-shadow: 0 6px 18px rgba(0,0,0,0.16)
        - overflow: hidden
      grid:
        - grid-template-areas: '"energy"'
        - grid-template-columns: 1fr
    custom_fields:
      energy: |
        [[[
          const entity = states['<SOSTITUISCI: sensor.casa_potenza_istantanea>'];
          const tot = entity ? Number(entity.state) : null;
          const attrs = entity?.attributes || {};
          const status = attrs.status || 'unknown';
          const percent = attrs.percent_of_max;
          const loads = attrs.loads || [];

          function color(s){
            if(s === 'critical') return '#e53935';
            if(s === 'warning') return '#fb8c00';
            if(s === 'ok') return '#43a047';
            return 'var(--disabled-text-color)';
          }

          function text(v){
            return v == null || isNaN(v) ? 'N/A' : Math.round(v) + ' W';
          }

          const c = color(status);
          const warning = status === 'critical';

          const loadHtml = loads.map(l => `
            <div style="padding:8px 10px;border-radius:12px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);">
              <div style="display:flex;justify-content:space-between;font-size:12px;gap:8px;">
                <span style="font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${l.name}</span>
                <span style="font-weight:800;color:${color(status)};white-space:nowrap;">${text(l.value)}</span>
              </div>
            </div>
          `).join('');

          return `
            <div style="display:flex;flex-direction:column;gap:10px;">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
                <div style="display:flex;align-items:center;gap:8px;min-width:0;">
                  <ha-icon icon="mdi:flash" style="width:18px;height:18px;color:${c};"></ha-icon>
                  <span style="font-weight:800;font-size:14px;">Energia</span>
                  ${warning ? `
                    <span style="font-size:10px;font-weight:800;color:#e53935;background:rgba(229,57,53,0.12);border:1px solid rgba(229,57,53,0.28);border-radius:999px;padding:2px 8px;white-space:nowrap;">ATTENZIONE</span>
                  ` : ''}
                </div>
                <div style="text-align:right;">
                  <div style="font-size:22px;font-weight:900;color:${c};white-space:nowrap;line-height:1;">${text(tot)}</div>
                  <div style="margin-top:3px;font-size:11px;color:var(--secondary-text-color);white-space:nowrap;">${percent == null ? 'N/A' : percent + '%'} soglia</div>
                </div>
              </div>

              ${warning ? `
                <div style="font-size:11px;font-weight:700;color:#e53935;background:rgba(229,57,53,0.08);border:1px solid rgba(229,57,53,0.18);border-radius:10px;padding:6px 10px;">
                  Vicino al limite del contatore
                </div>
              ` : ''}

              <div style="height:10px;border-radius:999px;background:rgba(255,255,255,0.08);overflow:hidden;">
                <div style="width:${percent == null ? 0 : Math.max(0, Math.min(100, percent))}%;height:100%;background:${c};border-radius:999px;"></div>
              </div>

              ${loads.length ? `<div style="display:grid;gap:8px;">${loadHtml}</div>` : ''}
            </div>
          `;
        ]]]
    card_mod:
      style: |
        ha-card{
          margin:0!important;
          border-bottom-left-radius:0!important;
          border-bottom-right-radius:0!important;
        }

  - type: custom:button-card
    entity: input_boolean.mostra_mesi_precedenti
    show_name: false
    show_state: false
    show_icon: false
    tap_action:
      action: toggle
    styles:
      card:
        - padding: 10px 12px
        - border-radius: 0
        - backdrop-filter: blur(10px)
        - background: rgba(255,255,255,0.08)
        - border: 1px solid rgba(255,255,255,0.12)
        - border-top: none
        - box-shadow: none
      grid:
        - grid-template-areas: '"mese"'
        - grid-template-columns: 1fr
    custom_fields:
      mese: |
        [[[
          let mesi = [];
          const raw = states['<SOSTITUISCI: sensor.casa_storico_consumi_mensili>']?.attributes?.mesi;
          if (raw) {
            try { mesi = typeof raw === 'string' ? JSON.parse(raw) : raw; }
            catch (e) { mesi = []; }
          }

          const oggi = new Date();
          const ymCorr = oggi.getFullYear() + '-' + String(oggi.getMonth()+1).padStart(2,'0');
          const corr = mesi.find(m => m.mese === ymCorr);
          const consumoCorr = corr ? Number(corr.kwh) : null;
          const costoCorr = corr && corr.costo != null ? Number(corr.costo) : null;
          const nPassati = mesi.filter(m => m.mese !== ymCorr).length;

          const maxv = mesi.length
            ? Math.max(...mesi.map(m => Number(m.kwh) || 0), 0.001) : 1;
          const w = consumoCorr == null ? 0
            : Math.max(0, Math.min(100, (consumoCorr/maxv)*100));

          const aperto = states['input_boolean.mostra_mesi_precedenti']?.state === 'on';

          return `
            <div>
              <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
                <span style="display:flex;align-items:center;gap:6px;font-weight:700;font-size:12px;">
                  <ha-icon icon="mdi:calendar-month" style="width:16px;height:16px;color:#42a5f5;"></ha-icon>
                  Mese corrente
                </span>
                <div style="text-align:right;">
                  <div style="font-weight:900;font-size:16px;color:#42a5f5;white-space:nowrap;line-height:1;">
                    ${consumoCorr == null ? 'N/A' : consumoCorr.toFixed(1) + ' kWh'}
                  </div>
                  <div style="font-size:11px;font-weight:700;color:var(--secondary-text-color);margin-top:2px;white-space:nowrap;">
                    ${costoCorr == null ? '' : '~ € ' + costoCorr.toFixed(2)}
                  </div>
                </div>
              </div>
              <div style="height:6px;border-radius:999px;background:rgba(255,255,255,0.06);overflow:hidden;margin-top:6px;">
                <div style="width:${w}%;height:100%;background:#42a5f5;border-radius:999px;"></div>
              </div>
              <div style="display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--secondary-text-color);margin-top:8px;">
                <span style="font-size:10px;">${aperto ? '▾' : '▸'}</span>
                ${aperto ? 'Nascondi' : 'Mostra'} mesi precedenti (${nPassati})
              </div>
            </div>
          `;
        ]]]

  - type: conditional
    conditions:
      - condition: state
        entity: input_boolean.mostra_mesi_precedenti
        state: 'on'
    card:
      type: custom:button-card
      show_name: false
      show_state: false
      show_icon: false
      tap_action:
        action: none
      styles:
        card:
          - padding: 4px 12px 12px 12px
          - border-radius: 0 0 16px 16px
          - backdrop-filter: blur(10px)
          - background: rgba(255,255,255,0.08)
          - border: 1px solid rgba(255,255,255,0.12)
          - border-top: none
          - box-shadow: 0 6px 18px rgba(0,0,0,0.16)
        grid:
          - grid-template-areas: '"lista"'
          - grid-template-columns: 1fr
      custom_fields:
        lista: |
          [[[
            let mesi = [];
            const raw = states['<SOSTITUISCI: sensor.casa_storico_consumi_mensili>']?.attributes?.mesi;
            if (raw) {
              try { mesi = typeof raw === 'string' ? JSON.parse(raw) : raw; }
              catch (e) { mesi = []; }
            }

            const nomi = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
                          'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
            const nomeMese = (ym) => {
              const p = ym.split('-');
              return nomi[parseInt(p[1],10)-1] + ' ' + p[0];
            };

            const oggi = new Date();
            const ymCorr = oggi.getFullYear() + '-' + String(oggi.getMonth()+1).padStart(2,'0');

            const passati = mesi
              .filter(m => m.mese !== ymCorr)
              .sort((a,b) => b.mese.localeCompare(a.mese));

            const maxv = mesi.length
              ? Math.max(...mesi.map(m => Number(m.kwh) || 0), 0.001) : 1;

            const bar = (v) => {
              const w = Math.max(0, Math.min(100, (Number(v)/maxv)*100));
              return `<div style="height:6px;border-radius:999px;background:rgba(255,255,255,0.06);overflow:hidden;margin-top:4px;">
                <div style="width:${w}%;height:100%;background:#42a5f5;border-radius:999px;"></div>
              </div>`;
            };

            if(!passati.length) return '<div style="font-size:11px;color:var(--secondary-text-color);">Nessun mese precedente disponibile</div>';

            return passati.map(m => `
              <div style="padding:6px 0;border-top:1px solid rgba(255,255,255,0.05);">
                <div style="display:flex;justify-content:space-between;font-size:11px;">
                  <span style="color:var(--secondary-text-color);">${nomeMese(m.mese)}</span>
                  <div style="text-align:right;">
                    <span style="font-weight:700;white-space:nowrap;">${Number(m.kwh).toFixed(1)} kWh</span>
                    ${m.costo != null ? `<span style="font-weight:600;white-space:nowrap;color:var(--secondary-text-color);margin-left:6px;">· ~€ ${Number(m.costo).toFixed(2)}</span>` : ''}
                  </div>
                </div>
                ${bar(m.kwh)}
              </div>
            `).join('');
          ]]]
      card_mod:
        style: |
          ha-card{
            margin:0!important;
          }
